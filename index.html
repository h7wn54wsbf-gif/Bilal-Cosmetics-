<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BillCalc</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{--bg:#423f52;--pur:#6100ed;--num:#4d619e;--red:#db2933;--blk:#000}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);font-family:-apple-system,system-ui,sans-serif;color:#fff}
#app{display:flex;flex-direction:column;height:100%;max-width:480px;margin:auto;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}
header{background:var(--pur);display:flex;align-items:center;gap:8px;padding:10px 14px}
header b{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:9px;background:#22c55e;padding:3px;border-radius:4px}
.logo{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#6100ed,#db3496);border:2px solid #fad273;display:flex;flex-direction:column;align-items:center;justify-content:center;font:bold 14px Georgia,serif;flex:none}
.logo i{display:block;width:12px;height:1.5px;background:#fad273;margin-top:1px}
.logo.big{width:64px;height:64px;font-size:26px;margin:auto}.logo.big i{width:24px;height:2px}
button{font:inherit;border:0;cursor:pointer;color:#fff}
.menu{background:none;font-size:22px}
#disp{background:#ebf2ed;color:#000;height:100px;padding:10px 12px;display:flex;flex-direction:column;justify-content:space-between}
#expr{font-size:16px;opacity:.7;text-align:right;white-space:nowrap;overflow:hidden}
#row{display:flex;align-items:center}
#bk{background:none;color:var(--red);font-size:26px;width:48px}
#val{flex:1;text-align:right;font-size:48px;font-weight:300;white-space:nowrap;overflow:hidden}
#eq{color:#7c3aed;font-size:14px;font-weight:700;margin-left:6px;white-space:nowrap}
#pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:10px;flex:1}
#pad button{border-radius:12px;font-size:26px;background:var(--blk);min-height:54px}
#pad .n{background:var(--num)}#pad .r{background:var(--red)}#pad .o{background:#f97316;font-size:22px}
#bar{background:rgba(0,0,0,.35);display:flex;align-items:center;justify-content:space-between;padding:10px 12px}
#bar span{font-weight:700}
.pill{background:#fff;color:#7c3aed;border-radius:20px;padding:7px 14px;font-size:12px;font-weight:700}
#st{display:flex;gap:8px;align-items:center;padding:6px 10px;font-size:10px;opacity:.9}
#st p{flex:1;margin:0}.pr{background:#22c55e;border-radius:15px;padding:7px 12px;font-size:12px;font-weight:700}
.modal{position:fixed;inset:0;background:#f2f2f7;color:#000;display:none;flex-direction:column;max-width:480px;margin:auto;z-index:5;padding-top:env(safe-area-inset-top)}
.modal.on{display:flex}
.mh{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#fff;font-weight:700}
.mh button{background:none;color:#007aff;font-size:16px}
.mb{flex:1;overflow:auto;padding:14px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:12px;box-shadow:0 1px 3px #0002}
.it{display:flex;gap:8px;align-items:center;background:#f3f3f3;border-radius:8px;padding:8px;margin-top:6px}
.it span{flex:1}.it button{background:none;font-size:16px}
.tot{display:flex;justify-content:space-between;font-weight:700;font-size:20px;color:#7c3aed;background:#ede9fe;border-radius:12px;padding:14px;margin-bottom:12px}
.big-btn{display:block;width:100%;padding:14px;border-radius:12px;font-weight:700;font-size:16px;background:#22c55e;margin-top:8px}
label{display:block;font-size:12px;color:#666;margin:10px 0 3px}
input,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:8px;font-size:16px}
#qrimg{background:#fff;padding:6px;border-radius:8px;image-rendering:pixelated;width:150px;display:block;margin:8px auto}
</style></head><body>
<div id="app">
<header><div class="logo">BC<i></i></div><b id="hn"></b><span class="tag">BT450M</span><button class="menu" onclick="show('set')">☰</button></header>
<div id="disp"><div id="expr">0</div><div id="row"><button id="bk" onclick="backspace()">⌫</button><div id="val">0</div><div id="eq"></div></div></div>
<div id="pad"></div>
<div id="bar"><span id="tt"></span><button class="pill" id="cnt" onclick="openBill()"></button></div>
<div id="st"><p id="msg">Ready - Print dabao</p><button class="pr" onclick="doPrint()">🖨 BT450M Print</button></div>
</div>

<div class="modal" id="bill"><div class="mh"><button onclick="hide('bill')">Close</button><span id="bt"></span><span></span></div>
<div class="mb"><div class="logo big">BC<i></i></div><h2 id="bs" style="text-align:center;color:#7c3aed;margin:8px 0"></h2>
<div class="card"><b>Items</b><div id="items"></div></div>
<div class="tot"><span>GRAND TOTAL</span><span id="gt"></span></div>
<div class="card" id="qrcard" style="text-align:center;display:none"><b style="color:#7c3aed;font-size:12px">SCAN TO PAY</b><img id="qrimg2" style="background:#fff;width:150px;image-rendering:pixelated"></div>
<button class="big-btn" onclick="hide('bill');doPrint()">🖨 Print on BT450M</button>
<button class="big-btn" style="background:#007aff" onclick="shareBill()">Share</button></div></div>

<div class="modal" id="set"><div class="mh"><button onclick="hide('set')">Close</button><span>Settings</span><span></span></div>
<div class="mb" id="form"></div></div>

<script>
const $=id=>document.getElementById(id);
const D={shopName:"BILAL COSMETICS",shopAddress:"Main Bazaar, Karachi",mobileNumber:"0300-1234567",mobileNumber2:"0312-7654321",thankYouMsg:"Thank you for visit your shopping",bankName:"UBL - Hasham Waseem",accountNumber:"1266314626545",paperSize:"58",qrPayload:""};
const S=JSON.parse(localStorage.getItem("bc_set")||"{}");for(const k in D)if(S[k]===undefined)S[k]=D[k];
const save=()=>localStorage.setItem("bc_set",JSON.stringify(S));
let cur="",lv=null,lo=null,lt="",stack=[],bills=[],hist=[];
const fmt=v=>Number.isInteger(v)?String(v):v.toFixed(2);
const ap=(a,o,b)=>o=="+"?a+b:o=="-"?a-b:o=="×"?a*b:o=="÷"?(b==0?a:a/b):b;
const pend=()=>{const i=cur!==""&&!isNaN(+cur)&&cur!=="-"?+cur:null;if(lv!==null)return(lo&&i!==null)?ap(lv,lo,i):lv;return i};
const items=()=>{const p=pend();return p===null?bills.slice():[...bills,p]};
const total=()=>items().reduce((a,b)=>a+b,0);
function render(){const t=total();
$("hn").textContent=S.shopName;
$("val").textContent=cur!==""?cur:lv!==null?fmt(lv):bills.length?fmt(t):"0";
$("expr").textContent=(hist.length?hist.join("+")+"+":"")+lt+cur||"0";
$("eq").textContent="= Rs "+fmt(t);$("tt").textContent="TOTAL: Rs "+fmt(t);$("cnt").textContent="BILL • "+items().length}
function num(n){if(cur.length>=10)return;if(n=="."){if(cur.includes("."))return;if(cur===""||cur=="-")cur+="0"}cur+=n;render()}
function commit(){const v=pend();if(v===null)return;let t=lt;if(cur!==""&&cur!=="-")t+=fmt(+cur);else if(t)t=t.slice(0,-1);
hist.push(t);bills.push(v);cur="";lv=null;lo=null;lt="";stack=[];render()}
function op(o){if(o=="-"&&cur===""&&lv===null){cur="-";render();return}
if(cur!==""&&!isNaN(+cur)&&cur!=="-"){const i=+cur;stack.push([lv,lo,lt,cur]);if(lv!==null&&lo){lv=ap(lv,lo,i);lt+=fmt(i)}else{lv=i;lt=fmt(i)}lo=o;lt+=o;cur=""}
else if(lv!==null){lo=o;lt=lt.slice(0,-1)+o}render()}
function pct(){if(cur!==""&&!isNaN(+cur)){cur=String(+cur/100)}render()}
function backspace(){if(cur!=="")cur=cur.slice(0,-1);else if(stack.length){[lv,lo,lt,cur]=stack.pop()}else if(bills.length){hist.pop();cur=fmt(bills.pop())}render()}
function clr(){if(cur!=="")cur="";else if(lv!==null){lv=null;lo=null;lt="";stack=[]}render()}
function ac(){cur="";lv=null;lo=null;lt="";stack=[];bills=[];hist=[];render()}
const keys=[["AC","r",ac],["C","r",clr],["%","",pct],["÷","",()=>op("÷")],
["7","n"],["8","n"],["9","n"],["X","",()=>op("×")],["4","n"],["5","n"],["6","n"],["-","",()=>op("-")],
["1","n"],["2","n"],["3","n"],["+","",commit],["0","n"],["=","",commit],[".","n"],["bill","o",()=>openBill()]];
keys.forEach(([t,c,f])=>{const b=document.createElement("button");b.textContent=t=="bill"?"📄":t;b.className=c;b.onclick=f||(()=>num(t));$("pad").appendChild(b)});

// ---- receipt text ----
const W=()=>S.paperSize=="80"?48:32;
const ctr=(s,w)=>" ".repeat(Math.max(0,Math.floor((w-s.length)/2)))+s+"\n";
const pad=(l,r,w)=>l+" ".repeat(Math.max(1,w-l.length-r.length))+r+"\n";
function top(){const w=W(),ln="-".repeat(w)+"\n";let t=ln+ctr(S.shopName,w)+ctr(S.shopAddress,w)+ctr("Mob: "+S.mobileNumber,w);
if(S.mobileNumber2)t+=ctr("Mob: "+S.mobileNumber2,w);t+=ln;items().forEach((n,i)=>t+=pad((i+1)+".","Rs "+fmt(n),w));
t+=ln+pad("TOTAL:","Rs "+fmt(total()),w)+ln;if(S.bankName)t+=ctr(S.bankName,w);if(S.accountNumber)t+=ctr("A/C: "+S.accountNumber,w);
if(S.qrPayload)t+=ln+ctr("SCAN TO PAY",w);return t}
function foot(){const w=W();return "-".repeat(w)+"\n"+ctr(S.thankYouMsg,w)+"\n\n"}

// ---- QR ----
function qrObj(p){const q=qrcode(0,"M");q.addData(p,"Byte");q.make();return q}
function qrDataUrl(p){return qrObj(p).createDataURL(8,8)}
function qrRaster(p,target){const q=qrObj(p),m=q.getModuleCount(),qz=2,sc=Math.max(1,Math.floor(target/(m+qz*2))),size=(m+qz*2)*sc,wb=Math.ceil(size/8);
const b=new Uint8Array(wb*size);for(let y=0;y<size;y++)for(let x=0;x<size;x++){const r=Math.floor(y/sc)-qz,c=Math.floor(x/sc)-qz;
if(r>=0&&c>=0&&r<m&&c<m&&q.isDark(r,c))b[y*wb+(x>>3)]|=0x80>>(x&7)}return{wb,h:size,b}}
function readQR(file){return new Promise(res=>{const im=new Image();im.onload=()=>{const c=document.createElement("canvas");
const k=Math.min(1,1400/Math.max(im.width,im.height));c.width=im.width*k;c.height=im.height*k;const x=c.getContext("2d");x.drawImage(im,0,0,c.width,c.height);
const d=x.getImageData(0,0,c.width,c.height);const r=jsQR(d.data,d.width,d.height,{inversionAttempts:"attemptBoth"});res(r?r.data:null)};
im.onerror=()=>res(null);im.src=URL.createObjectURL(file)})}

// ---- Bluetooth ----
const ascii=s=>Uint8Array.from(s,ch=>ch.charCodeAt(0)<128?ch.charCodeAt(0):63);
const cat=(...a)=>{const o=new Uint8Array(a.reduce((n,x)=>n+x.length,0));let p=0;a.forEach(x=>{o.set(x,p);p+=x.length});return o};
const SV=[0xff00,0x18f0,0xffe0,0xfee7,"e7810a71-73ae-499d-8c15-faa9aef0c3f2","49535343-fe7d-4aE5-8fa9-9fafd2059511"];
const PREF=["ff02","2af1","bef8d6c9-9c21-4c9e-b632-bd58c1009f9f","49535343-8841-43f4-a8d4-ecbe34729bb3","ffe1"];
const msg=t=>$("msg").textContent=t;
let busy=false;
async function doPrint(){
if(busy)return;
if(!navigator.bluetooth){msg("❌ Ye browser Bluetooth nahi chalata - Bluefy browser me kholo");alert("Bluetooth ke liye Bluefy browser (App Store) me kholo, Safari me nahi chalta.");return}
let parts=[new Uint8Array([0x1b,0x40,0x1b,0x61,0]),ascii(top())];
if(S.qrPayload){const r=qrRaster(S.qrPayload,S.paperSize=="80"?480:360);parts.push(new Uint8Array([0x1b,0x61,1]));
for(let y=0;y<r.h;y+=64){const n=Math.min(64,r.h-y);parts.push(new Uint8Array([0x1d,0x76,0x30,0,r.wb&255,r.wb>>8,n&255,n>>8]),r.b.subarray(y*r.wb,(y+n)*r.wb))}
parts.push(new Uint8Array([0x0a,0x1b,0x61,0]))}
parts.push(ascii(foot()),new Uint8Array([10,10,10,10]));const data=cat(...parts);
busy=true;
try{msg("🔍 Printer chuno...");
const dev=await navigator.bluetooth.requestDevice({acceptAllDevices:true,optionalServices:SV});
msg("Connecting to "+(dev.name||"printer")+"...");
const srv=await dev.gatt.connect();const svcs=await srv.getPrimaryServices();let ch=null,cands=[];
for(const s of svcs){const cs=await s.getCharacteristics();for(const c of cs)if(c.properties.write||c.properties.writeWithoutResponse)cands.push(c)}
ch=cands.find(c=>PREF.some(p=>c.uuid.includes(p)))||cands.find(c=>c.properties.writeWithoutResponse)||cands[0];
if(!ch)throw new Error("Print characteristic nahi mila");
msg("🖨 Print ho raha hai...");
const nr=ch.properties.writeWithoutResponse,sz=100;
for(let i=0;i<data.length;i+=sz){const c=data.slice(i,i+sz);if(nr)await ch.writeValueWithoutResponse(c);else await ch.writeValueWithResponse(c);await new Promise(r=>setTimeout(r,15))}
msg("✅ Print ho gaya! 🎉");setTimeout(()=>{try{dev.gatt.disconnect()}catch(e){}},1500)
}catch(e){msg("❌ "+(e.name=="NotFoundError"?"Printer nahi chuna":e.message))}
busy=false}

// ---- sheets ----
const show=id=>{if(id=="set")buildForm();$(id).classList.add("on")};
const hide=id=>{$(id).classList.remove("on");render()};
function openBill(){const it=items();$("bt").textContent="Bill - Rs "+fmt(total());$("bs").textContent=S.shopName;$("gt").textContent="Rs "+fmt(total());
$("items").innerHTML=it.map((n,i)=>`<div class="it"><span>${i+1}. Item</span><b>Rs ${fmt(n)}</b>${i<bills.length?`<button onclick="rm(${i})">🗑</button>`:""}</div>`).join("")||'<div style="color:#999;font-size:12px;margin-top:6px">Abhi koi item nahi</div>';
$("qrcard").style.display=S.qrPayload?"block":"none";if(S.qrPayload)$("qrimg2").src=qrDataUrl(S.qrPayload);show("bill")}
function rm(i){bills.splice(i,1);hist.splice(i,1);openBill()}
function shareBill(){const t=top()+foot();if(navigator.share)navigator.share({text:t}).catch(()=>{});else{navigator.clipboard&&navigator.clipboard.writeText(t);alert("Bill copy ho gaya")}}
function buildForm(){const f=[["shopName","Shop name"],["shopAddress","Address"],["mobileNumber","Mobile 1"],["mobileNumber2","Mobile 2"],["thankYouMsg","Thank you message"],["bankName","Bank / Account title"],["accountNumber","Account number"]];
$("form").innerHTML=f.map(([k,l])=>`<label>${l}</label><input value="${(S[k]||"").replace(/"/g,"&quot;")}" oninput="S.${k}=this.value;save()">`).join("")+
`<label>Paper size</label><select onchange="S.paperSize=this.value;save()"><option value="58" ${S.paperSize=="58"?"selected":""}>58 mm</option><option value="80" ${S.paperSize=="80"?"selected":""}>80 mm</option></select>
<label>QR Code (bill par print hoga) - sirf QR ka saaf screenshot chunein</label><input type="file" accept="image/*" onchange="pickQR(this.files[0])"><p id="qs" style="font-size:13px"></p>
<img id="qrimg" ${S.qrPayload?`src="${qrDataUrl(S.qrPayload)}"`:'style="display:none"'}>${S.qrPayload?'<button class="big-btn" style="background:#ef4444" onclick="S.qrPayload=\'\';save();buildForm()">QR hata do</button>':""}`}
async function pickQR(f){if(!f)return;const p=await readQR(f);if(p){S.qrPayload=p;save();buildForm();$("qs").textContent="✅ QR sahi parha gaya"}else $("qs").textContent="❌ QR parha nahi gaya - sirf QR ka saaf screenshot lo"}
render();
</script></body></html>
